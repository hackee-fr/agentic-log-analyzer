name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/dashboard/AgenticLogAnalyzer.Dashboard/web/pnpm-lock.yaml

      - name: Validate development scripts
        run: bash -n scripts/dev/*.sh

      - name: Validate Docker Compose configuration
        run: docker compose -f infrastructure/docker/docker-compose.yml config --quiet

      - name: Run frontend and .NET checks
        run: make verify
