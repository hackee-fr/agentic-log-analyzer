name: Desktop packages

# Builds the desktop app for Windows, macOS and Linux.
# - Called by the Release workflow when the version in Directory.Build.props changes: publishes the GitHub Release.
# - A pushed v* tag does the same.
# - Run it manually (Actions › Desktop packages › Run workflow) to get the packages as build artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the packages (default: 0.0.0-ci.<run number>)"
        required: false
  workflow_call:
    inputs:
      version:
        description: "Release version (X.Y.Z)"
        type: string
        required: true
      publish-release:
        description: "Create the vX.Y.Z tag and GitHub Release with the packages"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # "desktop" keeps this group distinct from the calling Release workflow's own group.
  group: ${{ github.workflow }}-desktop-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-24.04, rid: linux-x64 }
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_XMLDOC_MODE: skip
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/dashboard/AgenticLogAnalyzer.Dashboard/web/pnpm-lock.yaml

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging version $version"

      - name: Install icon tooling (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Build and package with Velopack
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.version.outputs.value }}
          # Releases download the previous version so that installed apps can apply small delta updates.
          PREVIOUS_RELEASES: ${{ (github.ref_type == 'tag' || inputs.publish-release) && 'github' || '' }}
        run: ./scripts/dev/desktop-package.sh

      - name: Keep only this version's packages
        env:
          VERSION: ${{ steps.version.outputs.value }}
        # vpk download adds the previous release's packages to the output folder; they are already published.
        run: find artifacts/packages -name '*.nupkg' ! -name "*-${VERSION}-*" -print -delete

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: artifacts/packages/${{ matrix.rid }}/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: github.ref_type == 'tag' || inputs.publish-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release version and notes
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then version="$INPUT_VERSION"; else version="${GITHUB_REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "## Install"
            echo
            echo "Install once; the app then updates itself from this repository's releases. The builds are not code-signed yet:"
            echo "- **Windows**: run \`AgenticLogAnalyzer-win-x64-Setup.exe\` (per-user install, no admin rights); SmartScreen may ask for confirmation."
            echo "- **macOS**: run \`AgenticLogAnalyzer-osx-arm64-Setup.pkg\` (Apple Silicon) or \`-osx-x64-Setup.pkg\` (Intel); if macOS blocks it, right-click › Open."
            echo "- **Linux**: \`chmod +x AgenticLogAnalyzer-linux-x64.AppImage\` and run it; requires WebKitGTK (\`libwebkit2gtk-4.1\`)."
            echo "- Portable \`.zip\` builds are also attached."
            echo
            echo "The assistant uses Ollama on http://localhost:11434 when it is running."
            echo "Docker images: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/agentic-log-analyzer-{api,dashboard}:${version}\`."
            echo
            echo "## Changes"
            echo
            # The CHANGELOG section for this version, without its heading.
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]: / { exit }
              found { print }
            ' CHANGELOG.md
          } > release-notes.md
          cat release-notes.md

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: packages
          merge-multiple: true

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.release.outputs.version }}
          body_path: release-notes.md
          files: packages/*
          make_latest: true
