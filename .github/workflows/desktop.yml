name: Desktop packages

# Builds the desktop app for Windows, macOS and Linux.
# - Push a tag such as v0.3.0 to publish a GitHub Release with every package.
# - Run it manually (Actions › Desktop packages › Run workflow) to get the packages as build artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the packages (default: 0.0.0-ci.<run number>)"
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-24.04, rid: linux-x64 }
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_XMLDOC_MODE: skip
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/dashboard/AgenticLogAnalyzer.Dashboard/web/pnpm-lock.yaml

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging version $version"

      - name: Install Inno Setup (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Install AppImage tooling (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin desktop-file-utils
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Build and package
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.version.outputs.value }}
          # Runners have no FUSE: run appimagetool without mounting itself.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./scripts/dev/desktop-package.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: artifacts/packages/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: packages
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          body: |
            Desktop builds of Agentic Log Analyzer. The builds are not code-signed yet:
            - macOS: open the .dmg, drag the app to Applications, then right-click › Open on first launch.
            - Windows: run the -setup.exe (per-user install, no admin rights); SmartScreen may ask for confirmation.
            - Linux: make the .AppImage executable (chmod +x) and run it; requires WebKitGTK (libwebkit2gtk-4.1).
            The assistant uses Ollama on http://localhost:11434 when it is running.
